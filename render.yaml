services:
  - type: web
    name: gimcheon-community
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    # Neon schema initialized; redeploy with the current database
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_SESSION_STORE
        value: "false"
      - key: R2_UPLOAD_ENABLED
        value: "false"
